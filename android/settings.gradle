pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream {
            properties.load(it)
        }

        def flutterSdkPath = properties.getProperty("flutter.sdk")

        assert flutterSdkPath != null : "flutter.sdk not set in local.properties"

        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gralePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"

    id "com.android.application" version "8.13.2" apply false

    id "org.jetbrains.kotlin.android" version "2.3.21" apply false
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)

    def storageUrl = System.getenv("FLUTTER_STORAGE_BASE_URL") ?: "https://storage.googleapis.com"

    repositories {
        google()
        mavenCentral()

        // Flutter engine rtifacts
        maven {
            url = uri("$storageUrl/download.flutter.io")
        }
    }
}

rootProject.name = "home_control_system"

include ":app"
